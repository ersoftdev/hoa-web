<div class="dropdown">
  <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" [disabled]="pending()" aria-expanded="false">
    @if (pending()) {
      <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
    } @else {
      <i class="bi bi-download me-1"></i>
    }
    Export
  </button>
  <ul class="dropdown-menu dropdown-menu-end">
    <li><button type="button" class="dropdown-item" (click)="formatSelected.emit('pdf')">PDF</button></li>
    <li><button type="button" class="dropdown-item" (click)="formatSelected.emit('excel')">Excel</button></li>
    <li><button type="button" class="dropdown-item" (click)="formatSelected.emit('csv')">CSV</button></li>
  </ul>
</div>
