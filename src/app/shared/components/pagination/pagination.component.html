@if (totalPages() > 1) {
  <nav aria-label="Pagination">
    <ul class="pagination mb-0">
      <li class="page-item" [class.disabled]="page() <= 1">
        <button class="page-link" type="button" (click)="goTo(page() - 1)" [disabled]="page() <= 1">Previous</button>
      </li>
      @for (p of pageNumbers(); track p) {
        <li class="page-item" [class.active]="p === page()">
          <button class="page-link" type="button" (click)="goTo(p)" [attr.aria-current]="p === page() ? 'page' : null">{{ p }}</button>
        </li>
      }
      <li class="page-item" [class.disabled]="page() >= totalPages()">
        <button class="page-link" type="button" (click)="goTo(page() + 1)" [disabled]="page() >= totalPages()">Next</button>
      </li>
    </ul>
  </nav>
}
